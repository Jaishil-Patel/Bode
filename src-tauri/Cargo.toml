[package]
name = "bode"
version = "0.4.0"
description = "A clean, lightweight, customizable PDF viewer"
authors = ["you"]
edition = "2021"
rust-version = "1.77.2"

[lib]
# The library is built as a cdylib for mobile and a staticlib/rlib for desktop.
name = "bode_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-dialog = "2"
tauri-plugin-fs = "2"
tauri-plugin-store = "2"
tauri-plugin-opener = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
# Already in the tree via `url`; used to build/parse `bodehtml://` paths.
percent-encoding = "2"
# Pure-Rust PDF library, used to write a decrypted copy of a password-protected PDF.
lopdf = "0.43"
tokio = { version = "1.53.1", features = ["rt-multi-thread", "net", "io-util", "sync", "macros", "fs"] }
rustls = { version = "0.23.43", default-features = false, features = ["ring", "std", "tls12"] }
tokio-rustls = { version = "0.26.4", default-features = false, features = ["ring", "tls12", "logging"] }
rcgen = { version = "0.14.7", default-features = false, features = ["pem", "ring"] }
axum = "0.8.4"
mdns-sd = "0.20.3"
sha2 = "0.10.9"
tower = { version = "0.5.3", features = ["util"] }
hyper = { version = "1.11.0", features = ["client", "http1", "server"] }
hyper-util = { version = "0.1.20", default-features = false, features = ["server", "tokio"] }
if-addrs = "0.15.0"
ring = "0.17.14"

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.59", features = ["Win32_Foundation", "Win32_Graphics_Dwm"] }

# Desktop-only: single-instance has no mobile support and must stay out of the cdylib build.
[target.'cfg(not(any(target_os = "android", target_os = "ios")))'.dependencies]
tauri-plugin-single-instance = "2"

[profile.release]
# Optimize for a small, fast binary — the whole point of choosing Tauri.
panic = "abort"
codegen-units = 1
lto = true
opt-level = "s"
strip = true
